name: Verificar aplicacao

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integracao:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: teste-descartavel
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      TEST_MYSQL_PASSWORD: teste-descartavel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Back-end/package-lock.json
      - run: npm ci
        working-directory: Back-end
      - run: npm test
        working-directory: Back-end
  navegadores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Back-end/package-lock.json
      - run: npm ci
        working-directory: Back-end
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: Back-end
      - run: npm run test:browser
        working-directory: Back-end
